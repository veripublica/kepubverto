[package]
name = "kepubverto"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Converts EPUB to KEPUB for Kobo e-readers, in pure Rust, without making the book worse."
license = "AGPL-3.0-only OR LicenseRef-veripublica-Commercial"
repository = "https://github.com/veripublica/kepubverto"
homepage = "https://github.com/veripublica/kepubverto"
readme = "README.md"
keywords = ["epub", "kepub", "kobo", "ebook", "converter"]
categories = ["command-line-utilities"]

# The WASM/JS boundary lives in a separate workspace member so its
# wasm-bindgen/serde/tsify deps never leak into this core crate (the epubveri
# and epubsana pattern). It reuses the core; it adds no conversion logic.
[workspace]
members = ["kepubverto-wasm"]

[dependencies]
# Three things come from the validator, so that they are never a second copy
# free to drift: `xmlguard::check` before every roxmltree parse, the EPUB 2
# entity declaration (`htm::declare_dtd_entities`, public since 0.21.1), and
# the `envelope` types for `--format json`. epubveri does not validate
# anything at run time here (docs/SPANS.md, "How never make a book worse is
# kept").
epubveri = "0.24"
# Pure Rust: the "deflate" feature uses zlib-rs on the 8.x line; bzip2/zstd (C)
# stay disabled. The family shares one zip major.
zip = { version = "8.6", default-features = false, features = ["deflate"] }
# Parse to find byte ranges, then insert at offsets; the document itself is
# never re-serialized. The same parser epubveri uses.
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2

# roxmltree recurses once per nesting level. Unoptimised, it aborts a 2 MiB
# thread (the `cargo test` default) at 125 levels, below the 256
# `epubveri::xmlguard` admits. Optimising this one crate is enough (measured
# by epubveri, 2026-09-23). Cargo ignores a dependency's profile settings, so
# this has to live in the root manifest of whoever builds.
[profile.dev.package.roxmltree]
opt-level = 1
