[package]
name = "kepubverto-wasm"
version = "0.2.3"
edition = "2024"
rust-version = "1.88"
description = "WebAssembly bindings for kepubverto — convert EPUB to KEPUB in the browser, no upload."
license = "AGPL-3.0-only OR LicenseRef-veripublica-Commercial"
# npm's canonical repository.url form. Not published to crates.io; its only
# consumer is wasm-pack → the npm package under the @veripublica scope.
repository = "git+https://github.com/veripublica/kepubverto.git"
homepage = "https://github.com/veripublica/kepubverto"
readme = "README.md"
keywords = ["epub", "kepub", "kobo", "wasm", "ebook"]
publish = false

# A thin JS boundary over kepubverto's public API; no conversion logic of its own.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kepubverto = { path = ".." }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
# Returned types cross the ABI as `tsify::Ts<T>`: the `#[tsify(into_wasm_abi)]`
# used before is deprecated since 0.5.7 because it leaks memory (tsify issue
# #65). epubveri (0.29.0) and epubsana made the same move. A `///` comment on
# a returned type is copied verbatim into the published `.d.ts`.
tsify = { version = "0.5", features = ["js"] }
